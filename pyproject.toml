[project]
name = "cartographer"
version = "0.2.0"
description = "Curated, source-anchored maps of cross-service behavior, served to coding agents over MCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
cartographer = "cartographer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartographer"]
